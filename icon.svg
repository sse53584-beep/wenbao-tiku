<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="文保题库">
  <!-- 背景：浅米色圆角底 -->
  <rect x="0" y="0" width="512" height="512" rx="96" ry="96" fill="#F5F1E8"/>
  <!-- 书脊阴影 -->
  <rect x="150" y="120" width="212" height="272" rx="14" ry="14" fill="#8C6A4E" opacity="0.12"/>
  <!-- 左书页 -->
  <path d="M256 128 C 210 112, 168 112, 132 128 L 132 384 C 168 368, 210 368, 256 384 Z" fill="#FFFFFF" stroke="#8C6A4E" stroke-width="10" stroke-linejoin="round"/>
  <!-- 右书页 -->
  <path d="M256 128 C 302 112, 344 112, 380 128 L 380 384 C 344 368, 302 368, 256 384 Z" fill="#FFFFFF" stroke="#8C6A4E" stroke-width="10" stroke-linejoin="round"/>
  <!-- 书脊中线 -->
  <path d="M256 128 L 256 384" stroke="#8C6A4E" stroke-width="10" stroke-linecap="round"/>
  <!-- 左书文字线 -->
  <g stroke="#8C6A4E" stroke-width="6" stroke-linecap="round" opacity="0.65">
    <path d="M156 176 L 232 168"/>
    <path d="M156 212 L 232 204"/>
    <path d="M156 248 L 232 240"/>
    <path d="M156 284 L 232 276"/>
    <path d="M156 320 L 232 312"/>
  </g>
  <!-- 右书文字线 -->
  <g stroke="#8C6A4E" stroke-width="6" stroke-linecap="round" opacity="0.65">
    <path d="M280 168 L 356 176"/>
    <path d="M280 204 L 356 212"/>
    <path d="M280 240 L 356 248"/>
    <path d="M280 276 L 356 284"/>
    <path d="M280 312 L 356 320"/>
  </g>
  <!-- 顶部小印章意象（点题：文物） -->
  <rect x="356" y="84" width="64" height="64" rx="12" ry="12" fill="#8C6A4E"/>
  <path d="M372 116 L 404 116 M388 100 L 388 132" stroke="#F5F1E8" stroke-width="8" stroke-linecap="round"/>
</svg>
